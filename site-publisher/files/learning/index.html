<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Learning Studio | Prototype</title>
<style>
:root{--ink:#192a36;--muted:#607182;--accent:#207868;--pale:#eaf4f0;--line:#dce5e7}*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:var(--ink);font:16px/1.6 system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d49d30;outline-offset:2px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}aside{background:white;border-right:1px solid var(--line);padding:25px}.platform{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand{background:#183746;color:white;border-radius:13px;padding:16px;margin:20px 0}.brand b{display:block}.brand small{color:#b9d1d5}.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:8px;color:#455a6b}.nav.active{background:var(--pale);color:#176858;font-weight:700}.nav.done:before{content:'✓ ';color:var(--accent)}.small{font-size:12px;color:var(--muted)}.sidefoot{border-top:1px solid var(--line);padding-top:18px;margin-top:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;background:white;border-bottom:1px solid var(--line);padding:15px 6vw}.top button,.secondary{background:white;color:var(--ink);border:1px solid var(--line)!important}.main{max-width:900px;padding:32px 24px 90px;margin:auto}h1{font-size:clamp(32px,4vw,48px);line-height:1.12;margin:7px 0 14px}h2{font-size:24px;line-height:1.25}p{color:#526373}.lead{font-size:18px}.meter{height:8px;background:#deebe5;border-radius:20px;overflow:hidden}.meter span{display:block;height:100%;background:var(--accent);transition:width .2s}.card{background:#fff;border:1px solid var(--line);padding:clamp(22px,4vw,38px);border-radius:16px;margin:24px 0}.hero{background:linear-gradient(125deg,#183746,#397885);border-radius:12px;padding:55px 30px;color:white;font-size:32px;font-weight:800;line-height:1.14}.hero em{color:#ffd16d;font-style:normal}.art{max-width:100%;border-radius:12px}.video{aspect-ratio:16/9;background:#1e3949;color:white;border-radius:13px;display:grid;place-items:center;text-align:center;padding:25px}.choice{display:flex;gap:13px;border:1px solid var(--line);padding:12px;border-radius:10px;margin:10px 0;cursor:pointer}.choice:has(input:checked){background:var(--pale);border-color:var(--accent)}input{accent-color:var(--accent)}.button{border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:9px;font-weight:700}.button:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px}.notice{background:var(--pale);border-left:4px solid var(--accent);padding:14px;border-radius:8px;margin-top:17px}.error{color:#9b3f39}.good{color:#126c55}.eyebrow{text-transform:uppercase;color:var(--accent);font-weight:800;letter-spacing:.09em;font-size:12px}.menu-toggle{display:none}
@media(max-width:760px){
html{scroll-padding-top:14px}
body{font-size:16px;line-height:1.6}
.layout{display:block;min-height:100vh}
aside{padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line)}
aside>.platform:first-child{font-size:11px}
.brand{margin:8px 0 12px;padding:10px 13px;border-radius:9px}
.brand b{font-size:15px}.brand small{font-size:11px}
.menu-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:white;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-height:48px;font-weight:700;margin-bottom:12px}
.menu-toggle .chevron{transition:transform .2s}.menu-toggle[aria-expanded="true"] .chevron{transform:rotate(180deg)}
#mobileNav{display:none;background:#fff;margin:0 -16px;padding:8px 16px 14px;border-top:1px solid var(--line)}
#mobileNav.open{display:block}
#mobileNav>.platform{margin:6px 0 5px}
.navwrap{display:block;max-height:55vh;overflow-y:auto;overscroll-behavior:contain}
.nav{min-width:0;min-height:46px;white-space:normal;padding:11px 12px;margin:2px 0}
.sidefoot{display:none}
.top{padding:12px 17px;gap:12px;align-items:flex-start}
.top>div{min-width:0;line-height:1.3}
.top b{display:block;font-size:14px}
.top .small{font-size:11px;margin-top:3px}
.top button{flex-shrink:0;font-size:12px;padding:9px 11px;min-height:40px}
.main{padding:23px 16px 92px;max-width:100%;overflow-wrap:anywhere}
h1{font-size:clamp(29px,8vw,38px);line-height:1.12;margin:9px 0 11px}
h2{font-size:22px}
.lead{font-size:16px;line-height:1.6;margin-bottom:22px}
.card{padding:20px 17px;border-radius:12px;margin:18px 0}
.hero{font-size:clamp(25px,7vw,32px);padding:36px 22px}
.video{min-height:210px;aspect-ratio:auto}
.art{display:block;width:100%;height:auto}
.choice{min-height:52px;align-items:center;line-height:1.4;padding:13px}
.choice input{flex:0 0 auto;width:18px;height:18px}
.actions{gap:10px;position:sticky;bottom:0;z-index:3;background:#f4f7f8;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:20px;border-top:1px solid var(--line)}
.actions .button{flex:1 1 0;min-width:0;padding:12px 9px;font-size:13px;min-height:48px}
#submit,#checkBtn{width:100%;min-height:48px}
}
</style></head><body>
<div class="layout"><aside><div class="platform">Learning Studio</div><div class="brand"><b>Get Off Live Comedy</b><small>Example tenant branding</small></div><button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileNav"><span>☰ &nbsp; Course contents <span id="menuProgress"></span></span><span class="chevron" aria-hidden="true">⌄</span></button><div id="mobileNav"><div class="platform">Course contents</div><div class="navwrap" id="nav"></div></div><p class="small sidefoot">Prototype only. Progress and scores remain in this browser. No accounts or certificates are created.</p></aside><div><header class="top"><div><b>Working Safely in Live Comedy</b><div class="small">Example course</div></div><button class="button secondary" id="reset">Reset demo</button></header><main class="main"><div class="eyebrow" id="chapter"></div><h1 id="title"></h1><p class="lead" id="intro"></p><div style="display:flex;justify-content:space-between" class="small"><span>Course progress</span><span id="pct"></span></div><div class="meter"><span id="bar"></span></div><div id="content"></div><div class="actions"><button class="button secondary" id="back">← Previous</button><button class="button" id="next">Complete & continue →</button></div></main></div></div>
<script>
const lessons=[
{title:'Welcome',intro:'A practical introduction to professional conduct at live comedy events.'},
{title:'Shared responsibilities',intro:'What performers, promoters and venues can do.'},
{title:'Video and reflection',intro:'Use video to bring scenarios and stories to life.'},
{title:'Knowledge check',intro:'Check your understanding before the final assessment.'},
{title:'Final assessment',intro:'Three questions. Pass mark: 80%.'}
];
const questions=[
{q:'Who contributes to professional standards at a comedy event?',a:['Only the promoter','Performers, promoters and venues','Only the venue'],correct:1},
{q:'Where should a learner find a route to raise concerns?',a:['In clearly communicated event guidance','Only in a private social media group','Nowhere'],correct:0},
{q:'What is the best response when a concern is raised?',a:['Ignore it until the next show','Share it publicly immediately','Listen, document and follow the appropriate procedure'],correct:2}
];
const key='learning-studio-demo-v1', initial=()=>({page:0,done:[],answers:{},check:null,attempts:[]});let state;
try{state=Object.assign(initial(),JSON.parse(localStorage.getItem(key))||{});}catch(e){state=initial();}
state.page=Math.max(0,Math.min(4,Number(state.page)||0));if(!Array.isArray(state.done))state.done=[];if(!Array.isArray(state.attempts))state.attempts=[];if(!state.answers||typeof state.answers!=='object')state.answers={};
function setMenu(open){el('mobileNav').classList.toggle('open',open);el('menuToggle').setAttribute('aria-expanded',String(open));}
const el=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state)),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
el('nav').innerHTML=lessons.map((l,i)=>'<button class="nav '+(i===state.page?'active ':'')+(state.done.includes(i)?'done':'')+'" data-page="'+i+'">'+(i+1)+'. '+esc(l.title)+'</button>').join('');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);save();setMenu(false);draw();window.scrollTo({top:0,behavior:'instant'});});
const l=lessons[state.page];el('chapter').textContent='Lesson '+(state.page+1)+' of '+lessons.length;el('title').textContent=l.title;el('intro').textContent=l.intro;const pct=Math.round(state.done.length/lessons.length*100);el('pct').textContent=pct+'%';el('menuProgress').textContent='('+state.done.length+'/'+lessons.length+')';el('bar').style.width=pct+'%';let h='';
if(state.page===0)h='<section class="card"><div class="hero">Better comedy starts with <em>better practice.</em></div><h2>Welcome to the demonstration</h2><p>This placeholder course tests navigation, bookmarking and MCQs. It is not legal or safeguarding advice.</p><p>Every course can inherit its tenant brand and override it where appropriate.</p></section>';
if(state.page===1)h='<section class="card"><h2>Everyone has a role</h2><p>Promoters can explain expectations and reporting routes. Performers can respect colleagues and venue staff. Venue teams can ensure concerns reach someone able to respond.</p><div class="notice"><b>Reflection</b><div>How would someone raise a concern at your next event?</div></div></section><section class="card"><h2>Images in lessons</h2><svg class="art" role="img" aria-label="Illustration of a stage microphone" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="260" rx="12" fill="#193d49"/><circle cx="520" cy="120" r="95" fill="none" stroke="#ffd16d" stroke-width="4"/><rect x="492" y="50" width="56" height="96" rx="28" fill="#ffd16d"/><path d="M479 120a41 41 0 0082 0M520 161v39m-30 0h60" fill="none" stroke="#fff" stroke-width="6"/><text x="38" y="120" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">Shared responsibilities</text><text x="39" y="155" font-family="Arial,sans-serif" font-size="18" fill="#c3d6da">Example learning illustration</text></svg><p class="small">JPG, PNG and WebP images will be supported in /learning/assets/.</p></section>';
if(state.page===2)h='<section class="card"><h2>Watch and reflect</h2><div class="video"><div><div style="font-size:54px">▷</div><b>Video placeholder</b><div class="small" style="color:#c5d6df">Embedded or hosted videos will appear here.</div></div></div><p>Consider how you would respond if a concern were raised during an event.</p></section>';
if(state.page===3)h='<section class="card"><h2>Quick knowledge check</h2><p>Who contributes to maintaining professional standards?</p>'+['Only the promoter','Everyone involved','Only the venue'].map((o,i)=>'<label class="choice"><input type="radio" name="check" value="'+i+'" '+(state.check===i?'checked':'')+'> '+o+'</label>').join('')+'<button class="button" id="checkBtn">Check answer</button><div id="feedback" aria-live="polite"></div></section>';
if(state.page===4){h='<section class="card"><h2>Final assessment</h2><p>Answer all three questions, then submit. With an 80% pass mark, all three answers must be correct in this demonstration.</p>'+questions.map((q,i)=>'<div style="margin:20px 0"><b>'+(i+1)+'. '+esc(q.q)+'</b>'+q.a.map((a,j)=>'<label class="choice"><input type="radio" name="q'+i+'" data-question="'+i+'" value="'+j+'" '+(state.answers[i]===j?'checked':'')+'> '+esc(a)+'</label>').join('')+'</div>').join('')+'<button class="button" id="submit">Submit assessment</button><div id="feedback" aria-live="polite"></div>';if(state.attempts.length){let a=state.attempts.at(-1);h+='<p class="small">Latest attempt: '+a.score+'% · '+(a.passed?'Passed':'Not passed')+' · '+esc(a.date)+'</p>';}h+='</section>';}
el('content').innerHTML=h;el('back').disabled=state.page===0;el('next').textContent=state.page===4?'Finish course':'Complete & continue →';
document.querySelectorAll('input[name=check]').forEach(x=>x.onchange=()=>{state.check=Number(x.value);save();});
document.querySelectorAll('[data-question]').forEach(x=>x.onchange=()=>{state.answers[Number(x.dataset.question)]=Number(x.value);save();});
if(el('checkBtn'))el('checkBtn').onclick=()=>el('feedback').innerHTML='<div class="notice">'+(state.check===null?'Choose an answer first.':state.check===1?'Correct. Responsibility is shared.':'Not quite. Responsibility is shared among everyone involved.')+'</div>';
if(el('submit'))el('submit').onclick=()=>{if(questions.some((q,i)=>state.answers[i]===undefined)){el('feedback').innerHTML='<p class="error">Answer all three questions first.</p>';return;}const score=Math.round(100*questions.filter((q,i)=>state.answers[i]===q.correct).length/questions.length),passed=score>=80;state.attempts.push({score,passed,date:new Date().toLocaleString('en-GB')});if(passed&&!state.done.includes(4))state.done.push(4);save();draw();el('feedback').innerHTML='<div class="notice"><b class="'+(passed?'good':'error')+'">'+(passed?'Passed':'Not passed')+': '+score+'%</b><p>'+(passed?'The live platform would issue a certificate.':'Review the lessons and try again.')+'</p></div>';};
save();
}
el('menuToggle').onclick=()=>setMenu(el('menuToggle').getAttribute('aria-expanded')!=='true');
el('back').onclick=()=>{if(state.page){state.page--;draw();}};el('next').onclick=()=>{if(state.page<4){if(!state.done.includes(state.page))state.done.push(state.page);state.page++;draw();}else alert(state.attempts.some(a=>a.passed)?'Demonstration complete. The live platform would issue a certificate.':'Pass the assessment to complete this demonstration.');};el('reset').onclick=()=>{if(confirm('Clear demonstration progress on this browser?')){localStorage.removeItem(key);state=initial();draw();}};draw();
</script></body></html>
